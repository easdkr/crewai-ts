name: CI

# Build, type-check, lint, and test on every push to main and on pull requests.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Build first: scripts/*.mjs import ../dist/index.js, so type-aware lint
      # needs the built output present. Build also type-checks src via tsup's
      # .d.ts generation. (`npm run check` / tsc over test/ is intentionally not
      # gated — see notes about pre-existing test-only type errors.)
      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
