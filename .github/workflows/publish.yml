# Follow-up: publish workflows for @crewai-ts/nestjs and @crewai-ts/cli will be
# added in a separate PR. This workflow publishes @crewai-ts/core only.
name: Publish to npm

# Publishes @crewai-ts/core to npm when a version tag (vX.Y.Z) is pushed.
# Auth uses npm OIDC Trusted Publishing — no NPM_TOKEN secret is required.
# One-time setup: configure this repo + workflow as a Trusted Publisher on
# npmjs.com (package → Settings → Trusted Publisher).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      # OIDC trusted publishing requires npm >= 11.5.1; Node 22 bundles npm 10.x.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first: type-aware lint relies on built output in some packages.
      - name: Build
        run: pnpm -r build

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

      - name: Verify tag matches @crewai-ts/core version
        run: |
          PKG_VERSION="v$(node -p "require('./packages/core/package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match @crewai-ts/core version $PKG_VERSION"
            exit 1
          fi

      # No NODE_AUTH_TOKEN: npm authenticates via OIDC and attaches provenance
      # automatically. `prepack` rebuilds the dist output before packing.
      # `pnpm -F @crewai-ts/core exec npm publish` runs npm publish scoped to
      # the @crewai-ts/core workspace package only.
      - name: Publish @crewai-ts/core
        run: pnpm -F @crewai-ts/core exec npm publish --access public --provenance
