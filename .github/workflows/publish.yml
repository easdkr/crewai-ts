# Publishes @crewai-ts/* packages through Changesets Release PRs.
# Auth uses npm OIDC Trusted Publishing; no NPM_TOKEN secret is required.
# Configure this repo + workflow as a Trusted Publisher on npmjs.com for each package.

name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      # OIDC trusted publishing requires npm >= 11.5.1; Node 22 may bundle older npm.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

      - name: Create Release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_CONFIG_IGNORE_SCRIPTS: true
          NPM_CONFIG_PROVENANCE: true

      - name: Auto-merge Release PR
        if: steps.changesets.outputs.hasChangesets == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::notice title=Release auto-merge skipped::Set RELEASE_BOT_TOKEN to let CI merge Changesets Release PRs and trigger npm publishing."
            exit 0
          fi

          pr_number="${PR_NUMBER}"
          if [ -z "${pr_number}" ] || [ "${pr_number}" = "null" ]; then
            pr_number="$(gh pr list --head changeset-release/main --base main --state open --json number --jq '.[0].number')"
          fi

          if [ -z "${pr_number}" ] || [ "${pr_number}" = "null" ]; then
            echo "::error::Changesets reported pending changesets, but no release PR number was found."
            exit 1
          fi

          gh pr merge "${pr_number}" --squash --auto --delete-branch || \
            gh pr merge "${pr_number}" --squash --delete-branch
