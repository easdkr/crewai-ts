name: Publish to npm

# Publishes @crewai-ts/core to npm when a version tag (vX.Y.Z) is pushed.
# Auth uses npm OIDC Trusted Publishing — no NPM_TOKEN secret is required.
# One-time setup: configure this repo + workflow as a Trusted Publisher on
# npmjs.com (package → Settings → Trusted Publisher).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing requires npm >= 11.5.1; Node 22 bundles npm 10.x.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # No NODE_AUTH_TOKEN: npm authenticates via OIDC and attaches provenance
      # automatically. `prepack` rebuilds the dist output before packing.
      - name: Publish
        run: npm publish --access public
