# Publishes all @crewai-ts/* packages to npm when a version tag is pushed.
# Auth uses npm OIDC Trusted Publishing — no NPM_TOKEN secret is required.
# One-time setup: configure this repo + workflow as a Trusted Publisher on
# npmjs.com for each package (package → Settings → Trusted Publisher).

name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      # OIDC trusted publishing requires npm >= 11.5.1; Node 22 bundles npm 10.x.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first: type-aware lint relies on built output in some packages.
      - name: Build
        run: pnpm -r build

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

      - name: Verify tag matches @crewai-ts/core version
        run: |
          PKG_VERSION="v$(node -p "require('./packages/core/package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match @crewai-ts/core version $PKG_VERSION"
            exit 1
          fi

      # Publish all workspace packages in dependency order.
      # Core first, then packages that depend only on core,
      # then packages with cross-dependencies.
      - name: Publish @crewai-ts/core
        run: pnpm -F @crewai-ts/core exec npm publish --access public --provenance

      - name: Publish @crewai-ts/openai
        run: pnpm -F @crewai-ts/openai exec npm publish --access public --provenance

      - name: Publish @crewai-ts/anthropic
        run: pnpm -F @crewai-ts/anthropic exec npm publish --access public --provenance

      - name: Publish @crewai-ts/gemini
        run: pnpm -F @crewai-ts/gemini exec npm publish --access public --provenance

      - name: Publish @crewai-ts/bedrock
        run: pnpm -F @crewai-ts/bedrock exec npm publish --access public --provenance

      - name: Publish @crewai-ts/azure
        run: pnpm -F @crewai-ts/azure exec npm publish --access public --provenance

      - name: Publish @crewai-ts/snowflake
        run: pnpm -F @crewai-ts/snowflake exec npm publish --access public --provenance

      - name: Publish @crewai-ts/rag
        run: pnpm -F @crewai-ts/rag exec npm publish --access public --provenance

      - name: Publish @crewai-ts/mcp
        run: pnpm -F @crewai-ts/mcp exec npm publish --access public --provenance

      - name: Publish @crewai-ts/a2a
        run: pnpm -F @crewai-ts/a2a exec npm publish --access public --provenance

      - name: Publish @crewai-ts/flow
        run: pnpm -F @crewai-ts/flow exec npm publish --access public --provenance

      - name: Publish @crewai-ts/nestjs
        run: pnpm -F @crewai-ts/nestjs exec npm publish --access public --provenance

      - name: Publish @crewai-ts/cli
        run: pnpm -F @crewai-ts/cli exec npm publish --access public --provenance
