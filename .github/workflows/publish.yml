# Publishes @crewai-ts/* packages directly from main after versioning changesets.
# Auth uses npm OIDC Trusted Publishing; no NPM_TOKEN secret is required.
# Configure this repo + workflow as a Trusted Publisher on npmjs.com for each package.

name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      # OIDC trusted publishing requires npm >= 11.5.1; Node 22 may bundle older npm.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

      - name: Version packages on main
        id: version
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::notice title=Release skipped::main moved while this workflow was running; a newer publish workflow will handle the release."
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pnpm changeset:version

          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Version Packages"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.version.outputs.stale != 'true'
        run: pnpm release
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: true
          NPM_CONFIG_PROVENANCE: true

      - name: Push release tags
        if: steps.version.outputs.stale != 'true'
        run: git push origin --tags
