name: Publish @crewai-ts/nestjs to npm

# Publishes @crewai-ts/nestjs to npm when a nestjs version tag is pushed.
# First publish can use an NPM_TOKEN repository secret. After the package exists,
# npm Trusted Publishing can be configured for this workflow and the token can be
# removed.
on:
  push:
    tags:
      - "nestjs-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

      - name: Verify tag matches @crewai-ts/nestjs version
        run: |
          PKG_VERSION="nestjs-v$(node -p "require('./packages/nestjs/package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match @crewai-ts/nestjs version tag $PKG_VERSION"
            exit 1
          fi

      - name: Publish @crewai-ts/nestjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          fi
          pnpm -F @crewai-ts/nestjs exec npm publish --access public --provenance
